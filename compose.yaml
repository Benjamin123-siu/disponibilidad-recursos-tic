services:
  primaria:
    image: postgres:16
    command: ["postgres", "-c", "hba_file=/etc/postgresql/acceso.conf", "-c", "wal_keep_size=128MB"]
    environment:
      POSTGRES_DB: recursos_tic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - primaria_datos:/var/lib/postgresql/data
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/acceso.conf:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "recursos_tic"]
      interval: 5s
      timeout: 3s
      retries: 12

  configurar-replicacion:
    image: postgres:16
    depends_on:
      primaria:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Configura REPLICATION_PASSWORD en .env}
    volumes:
      - ./infra/postgres/replicador.sql:/tmp/replicador.sql:ro
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-h", "primaria", "-U", "postgres", "-d", "recursos_tic", "-f", "/tmp/replicador.sql"]

  replica:
    image: postgres:16
    user: postgres
    depends_on:
      configurar-replicacion:
        condition: service_completed_successfully
    environment:
      PGDATA: /var/lib/postgresql/data/standby
      PGPASSWORD: ${REPLICATION_PASSWORD:?}
    volumes:
      - replica_datos:/var/lib/postgresql/data
      - ./infra/postgres/replica.sh:/opt/replica.sh:ro
    entrypoint: ["sh", "/opt/replica.sh"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "recursos_tic"]
      interval: 5s
      timeout: 3s
      retries: 12

  instancia-1:
    image: nginx:stable-alpine
    hostname: instancia-1
    volumes:
      - ./infra/nginx/instancia.conf:/etc/nginx/conf.d/default.conf:ro

  instancia-2:
    image: nginx:stable-alpine
    hostname: instancia-2
    volumes:
      - ./infra/nginx/instancia.conf:/etc/nginx/conf.d/default.conf:ro

  balanceador:
    image: nginx:stable-alpine
    depends_on:
      - instancia-1
      - instancia-2
    volumes:
      - ./infra/nginx/balanceador.conf:/etc/nginx/conf.d/default.conf:ro

  kong:
    image: kong:3.9
    entrypoint:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf '%s\n' "$$FASE2_CONFIG" > /dev/shm/fase2-kong.yml
        unset FASE2_CONFIG
        exec /docker-entrypoint.sh kong docker-start
    depends_on:
      - balanceador
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "off"
      KONG_DECLARATIVE_CONFIG: /dev/shm/fase2-kong.yml
      FASE2_CONFIG: |
        _format_version: "3.0"
        services:
          - name: balanceador
            url: http://balanceador:80
            routes:
              - name: salud
                paths: ["~/health$$"]
                methods: [GET]
                strip_path: false
            plugins:
              - name: key-auth
                config:
                  key_names: [apikey]
                  key_in_query: false
                  key_in_body: false
                  hide_credentials: true
        consumers:
          - username: prueba-fase2
            keyauth_credentials:
              - key: "${KONG_API_KEY:?Configura KONG_API_KEY en .env}"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  primaria_datos:
  replica_datos:
